# ASMI GECO POCs — one server, two sub-paths.
#   /document-assembly/  → HelmDocs, static build (Vite, base /document-assembly/)
#   /genai-learning/     → HelmLearn, served by `vite preview` on 127.0.0.1:4173 (it needs its
#                          /api/fetch-url middleware and the /api/deepseek proxy, so it is not purely static)
server {
    listen 80;
    server_name _;

    root /var/www/asmi-poc;
    index index.html;

    # landing page linking both POCs
    location = / { try_files /index.html =404; }

    location /document-assembly/ {
        alias /var/www/asmi-poc/document-assembly/;
        try_files $uri $uri/ /document-assembly/index.html;
        add_header Cache-Control "no-cache";
    }
    location /document-assembly/assets/ {
        alias /var/www/asmi-poc/document-assembly/assets/;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /genai-learning/ {
        proxy_pass http://127.0.0.1:4173/genai-learning/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    # HelmLearn's own server-side helpers (URL import + DeepSeek relay) are addressed from the site root
    location /api/ {
        proxy_pass http://127.0.0.1:4173/api/;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }

    client_max_body_size 50m;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;
}
